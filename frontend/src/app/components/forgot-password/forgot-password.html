<div class="auth-shell">
  <section class="brand-panel">
    <div class="brand-copy">
      <h1>Q-LESS</h1>
      <span></span>
      <p>Recupera el acceso a tu cuenta y continua gestionando tus pedidos de forma rapida y sencilla.</p>
    </div>
  </section>

  <section class="form-panel">
    <article class="auth-card">
      <div class="profile-circle">
        <i class="bi bi-envelope-check"></i>
      </div>

      <h2>Olvidaste tu contrasena?</h2>
      <p class="card-text">Escribe tu correo y te enviaremos un enlace seguro para crear una nueva contrasena.</p>

      <div *ngIf="alerts.length > 0" class="alerts-container" aria-live="assertive">
        <div *ngFor="let alert of alerts" [ngClass]="'alert alert-' + alert.type" role="alert">
          {{ alert.message }}
        </div>
      </div>

      <form (ngSubmit)="sendResetLink()" novalidate>
        <div class="input-group">
          <i class="bi bi-envelope"></i>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Correo electronico" required>
        </div>

        <button type="submit" class="primary-button" [disabled]="isLoading">
          {{ isLoading ? 'Enviando...' : 'Enviar enlace' }}
        </button>

        <button type="button" class="secondary-button" routerLink="/login">
          Volver al inicio de sesion
        </button>
      </form>
    </article>
  </section>
</div>
