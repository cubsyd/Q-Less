<div class="main-container">
  <div class="section left-section">
    <div class="text-content">
      <h1 class="logo-title">Q-LESS</h1>
      <div class="underline"></div>
      <p class="description-text">
        Tu papeleria virtual del CBA - SENA. Gestiona tus pedidos de forma rapida y sencilla.
      </p>
    </div>
  </div>

  <div class="section right-section">
    <div class="login-card">
      <div class="profile-circle">
        <img src="https://img.icons8.com/?size=100&id=7820&format=png&color=FFFFFF" alt="Carrito Q-LESS" class="cart-icon-img">
      </div>

      <div *ngIf="errors.length > 0" class="alerts-container">
        <div *ngFor="let alert of errors" [ngClass]="'alert alert-' + alert.type" role="alert">
          {{ alert.message }}
        </div>
      </div>

      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm" novalidate>
        <div class="input-group">
          <i class="bi bi-person-fill"></i>
          <input type="email" [(ngModel)]="credentials.email" name="email" placeholder="Correo electronico" required>
        </div>

        <div class="input-group password-input-group">
          <i class="bi bi-lock-fill"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="credentials.password"
            name="password"
            placeholder="Contrasena"
            required
          >
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contrasena' : 'Ver contrasena'"
          >
            <i [class]="showPassword ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
          </button>
        </div>

        <button type="submit" class="login-button" [disabled]="isLoading">
          {{ isLoading ? 'Iniciando...' : 'Inicia sesion' }}
        </button>

        <div class="divider">
          <span>O</span>
        </div>

        <div class="register-container">
          <p class="small-text">No tienes una cuenta?</p>
          <button type="button" class="register-button" routerLink="/register">
            Crea una cuenta
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
