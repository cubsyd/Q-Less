<div class="auth-shell">
  <section class="brand-panel">
    <div class="brand-copy">
      <h1>Q-LESS</h1>
      <span></span>
      <p>Crea una contrasena nueva y segura para volver a ingresar a tu cuenta.</p>
    </div>
  </section>

  <section class="form-panel">
    <article class="auth-card">
      <div class="profile-circle">
        <i class="bi bi-shield-lock"></i>
      </div>

      <h2>Restablecer contrasena</h2>
      <p class="card-text">Usa una contrasena segura para proteger tu cuenta de Q-LESS.</p>

      <div *ngIf="alerts.length > 0" class="alerts-container" aria-live="assertive">
        <div *ngFor="let alert of alerts" [ngClass]="'alert alert-' + alert.type" role="alert">
          {{ alert.message }}
        </div>
      </div>

      <form (ngSubmit)="resetPassword()" novalidate>
        <div class="input-group">
          <i class="bi bi-envelope"></i>
          <input type="email" [(ngModel)]="email" name="email" readonly>
        </div>

        <div class="input-group password-input-group">
          <i class="bi bi-lock"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Nueva contrasena"
            required
          >
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility('password')">
            <i [class]="showPassword ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
          </button>
        </div>

        <div class="password-strength" [class]="passwordStrengthClass">
          <div class="strength-head">
            <div class="strength-track">
              <span [style.width]="passwordStrengthWidth"></span>
            </div>
            <strong>{{ passwordStrengthLabel }}</strong>
          </div>
          <div class="password-rules">
            <span *ngFor="let rule of passwordRules" [class.passed]="rule.passed">
              {{ rule.passed ? 'OK' : 'No' }} {{ rule.label }}
            </span>
          </div>
        </div>

        <div class="input-group password-input-group">
          <i class="bi bi-lock"></i>
          <input
            [type]="showPasswordConfirmation ? 'text' : 'password'"
            [(ngModel)]="passwordConfirmation"
            name="password_confirmation"
            placeholder="Confirmar contrasena"
            required
          >
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility('confirmation')">
            <i [class]="showPasswordConfirmation ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
          </button>
        </div>

        <button type="submit" class="primary-button" [disabled]="isLoading || !email || !token">
          {{ isLoading ? 'Guardando...' : 'Actualizar contrasena' }}
        </button>

        <button type="button" class="secondary-button" routerLink="/login">
          Volver al inicio de sesion
        </button>
      </form>
    </article>
  </section>
</div>
