[phases.install]
cmds = [
  "cd backend/laravel_backend/backend_Q-LESS && composer install --optimize-autoloader --no-dev --no-scripts --no-interaction"
]

[phases.build]
cmds = [
  "cd backend/laravel_backend/backend_Q-LESS && php artisan config:clear && php artisan route:clear && php artisan view:clear"
]

[start]
cmd = "cd backend/laravel_backend/backend_Q-LESS && php artisan serve --host=0.0.0.0 --port=${PORT}"
